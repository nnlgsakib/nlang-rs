[package]
name = "nlang"
version = "3.0.0"
edition = "2024"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
tempfile = "3.0"
thiserror = "1.0"
anyhow = "1.0"
prettyplease = "0.2.37"
codemap = "0.1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
regex = "1.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt","env-filter"] }
chrono = { version = "0.4" }
toml = "0.8"
lazy_static = "1.4"
urlencoding = "2.1"
native-tls = "0.2"
base64 = "0.21"
sha1 = "0.10"
quinn = { version = "0.11", default-features = false, features = ["rustls", "ring", "runtime-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
rcgen = "0.13"

[dependencies.tokio]
version = "1"
features = ["rt-multi-thread","macros","net","io-util"]

[dependencies.tower-lsp]
version = "0.20"


[[bin]]
name = "nscan"
path = "src/nscan/main.rs"

[profile.release]
debug = false
strip = false
lto = true
codegen-units = 1